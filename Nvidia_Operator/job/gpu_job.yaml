apiVersion: batch/v1
kind: Pod
metadata:
  labels:
    app: gpu-pod
  name: gpu-pod
spec:
  template:
    metadata:
      labels:
        app: gpu-pod
    spec:
      nodeSelector:
        kubernetes.io/hostname: aks-migpoc-27540834-vmss000000
      containers:
      - name: gpu-pod
        image: mcr.microsoft.com/azuredocs/samples-tf-mnist-demo:gpu
        args: ["--max_steps", "500"]
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            "nvidia.com/mig-1g.10gb": 1
      restartPolicy: OnFailure
      tolerations:
      - key: "sku"
        operator: "Equal"
        value: "gpu"
        effect: "NoSchedule"