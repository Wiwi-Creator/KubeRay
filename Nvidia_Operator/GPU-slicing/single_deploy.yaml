apiVersion: apps/v1
kind: Deployment
metadata:
  name: single-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nv-single
  template:
    metadata:
      labels:
        app: nv-single
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${node_name}
      containers:
      - name: nv-single
        image: nvidia/cuda:12.1.1-base-ubuntu22.04
        command: ["/bin/sh"]
        args: ["-c","sleep 1000"]
        resources:
          limits:
            "nvidia.com/gpu": 1