apiVersion: apps/v1
kind: Deployment
metadata:
  name: nvidia-mixed2
spec:
  replicas: 10
  selector:
    matchLabels:
      app: nvidia-mixed-deploy
  template:
    metadata:
      labels:
        app: nvidia-mixed-deploy
    spec:
      nodeSelector:
            kubernetes.io/hostname: ${node_name}
      containers:
      - name: nvidia-mixed
        image: nvidia/cuda:12.1.1-base-ubuntu22.04
        command: ["/bin/sh"]
        args: ["-c","sleep 1000"]
        resources:
          limits:
            "nvidia.com/mig-1g.10gb": 1